# Personal build: compile a debug Android APK with the DeepSeek word-lookup
# feature and upload it as a workflow artifact. Debug APKs are self-signed by
# the Android debug key, so they install by sideloading with no keystore setup.
# Trigger manually from the Actions tab (workflow_dispatch) or by pushing to the
# deepseek-lookup branch.
name: DeepSeek APK

on:
  workflow_dispatch:
  push:
    branches:
      - deepseek-lookup

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: deepseek-apk-android

      - name: create .env.local for Next.js
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/readest-app/.env.local

      - name: build signed arm64 release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cd apps/readest-app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          # Generate a throwaway keystore so the release APK is signed and
          # therefore directly installable (no Play/official signature).
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ks.jks" \
            -storepass android -keypass android -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Readest DeepSeek"
          pushd src-tauri/gen/android
          {
            echo "keyAlias=key"
            echo "password=android"
            echo "storeFile=$RUNNER_TEMP/ks.jks"
          } > keystore.properties
          popd
          # arm64 only → one small APK instead of a ~560MB universal debug.
          pnpm tauri android build --target aarch64
          echo "=== produced APKs ==="
          find src-tauri/gen/android -name '*.apk' -exec ls -lh {} \;
          apk=$(find src-tauri/gen/android -path '*release*' -name '*.apk' ! -name '*unsigned*' | head -1)
          echo "picked: $apk"
          cp "$apk" readest-deepseek-arm64.apk

      - name: upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-deepseek-apk
          path: apps/readest-app/readest-deepseek-arm64.apk
          if-no-files-found: error
